<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #header {
            background-color: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            padding: 0 20px;
        }

        #header h1 {
            font-family: "Lalezar", system-ui;
            font-size: 36px;
            font-weight: 1000;
            color: white;
        }

        #login {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 5px 10px;
        }

        #login img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(104, 99, 174, 0.8);
        }

        #login p {
            font-family: "Lalezar", system-ui;
            font-size: 18px;
            font-weight: 600;
            margin-left: 10px;
            color: rgb(104, 99, 174);
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }

        #form-container {
            width: 500px;
            padding: 20px;
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #form-container h2 {
            text-align: center;
            font-family: "Lalezar", system-ui;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="file"] {
            width: 90%; /* Reduced the width */
            padding: 10px; /* Reduced padding */
            border: 1px solid black;
            border-radius: 15px;
            font-size: 14px; /* Slightly smaller font size */
        }

        .options .option-wrapper input[type="text"] {
            margin-bottom: 10px;
        }

        #photo-preview {
            margin-top: 20px;
            display: none;
            position: relative;
        }

        #photo-preview img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        #photo-preview button {
            display: inline-block;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-button {
            width: 100%;
            padding: 10px;
            background-color: #4B006E;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: "Lalezar", system-ui;
            font-size: 18px;
        }

        .submit-button:hover {
            background-color: #CBC3E3;
        }

        #footer {
            height: 72px;
            width: 100%;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            font-size: small;
            padding-top: 10px;
        }

        #footer ul {
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        #footer ul li {
            display: inline;
            list-style-type: none;
            font-size: 16px;
            padding: 16px;
            text-align: center;
        }

        #footer #instagram, #footer #facebook {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        #footer #facebook {
            margin-left: 4px;
        }

        #footer #copy {
            text-align: center;
            font-size: 16px;
        }

        /* Wrapper for options */
        .option-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .option-wrapper input[type="text"] {
            width: 100%;
            padding-right: 40px; /* Add space for the button */
            border: 1px solid black;
            border-radius: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Correct Answer Button */
        .correct-answer {
            position: absolute;
            top: 50%;
            right: 10px; /* Align to the far right */
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            height: 20px;
            width: 20px;
        }

        .correct-answer img {
            max-height: 100%;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div id="header">
        <h1>NameThatTune</h1>
        <div id="login">
            <img src="avatar.png" alt="User Avatar">
            <p>Username</p>
        </div>
    </div>

    <!-- Main Content Section -->
    <div id="container">
        <div id="form-container">
            <h2>Edit Quiz</h2>
            <form id="quiz-form">
                <div class="form-group">
                    <label for="song-name">Song Name</label>
                    <input type="text" id="song-name" placeholder="Enter Song Name">
                </div>

                <div class="form-group">
                    <label for="song-photo">Song Photo</label>
                    <input type="file" id="song-photo">
                </div>

                <div id="photo-preview">
                    <img id="preview-image" src="" alt="Song Preview">
                    <button type="button" id="delete-photo">Delete Photo</button>
                </div>

                <div class="form-group options">
                    <label>Options</label>
                    <div class="option-wrapper">
                        <input type="text" placeholder="Option 1">
                        <button type="button" class="correct-answer">
                            <img src="Icon/select.png" alt="Correct Answer">
                        </button>
                    </div>
                    <div class="option-wrapper">
                        <input type="text" placeholder="Option 2">
                        <button type="button" class="not correct-answer">
                            <img src="Icon/no_select.png" alt="Not Correct Answer">
                        </button>
                    </div>
                    <div class="option-wrapper">
                        <input type="text" placeholder="Option 3">
                        <button type="button" class="not correct-answer">
                            <img src="Icon/no_select.png" alt="Not Correct Answer">
                        </button>
                    </div>
                    <div class="option-wrapper">
                        <input type="text" placeholder="Option 4">
                        <button type="button" class="not correct-answer">
                            <img src="Icon/no_select.png" alt="Not Correct Answer">
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-button">Confirm</button>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <div id="footer">
        <ul>
            <li>About Us</li>
            <li>Terms and Conditions</li>
            <li>Privacy Policy</li>
            <li>Contact Us
                <img src="Icon/facebook.png" alt="Facebook" id="facebook">
                <img src="Icon/instagram.png" alt="Instagram" id="instagram">
            </li>
        </ul>
        <p id="copy">&copy; 2025 NameThatTune. All Rights Reserved.</p>
    </div>

    <script>
        // Preview and delete photo functionality
        const fileInput = document.getElementById('song-photo');
        const previewContainer = document.getElementById('photo-preview');
        const previewImage = document.getElementById('preview-image');
        const deletePhotoButton = document.getElementById('delete-photo');

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        deletePhotoButton.addEventListener('click', () => {
            fileInput.value = '';
            previewContainer.style.display = 'none';
            previewImage.src = '';
        });
    </script>
</body>
</html>
