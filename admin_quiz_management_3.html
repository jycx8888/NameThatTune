<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #header {
            background-color: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            padding: 0 20px;
        }

        #header h1 {
            font-family: "Lalezar", system-ui;
            font-size: 36px;
            font-weight: 1000;
            color: white;
        }

        #login {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 5px 10px;
        }

        #login img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(104, 99, 174, 0.8);
        }

        #login p {
            font-family: "Lalezar", system-ui;
            font-size: 18px;
            font-weight: 600;
            margin-left: 10px;
            color: rgb(104, 99, 174);
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }

        #form-container {
            width: 500px;
            padding: 20px;
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #form-container h2 {
            text-align: center;
            font-family: "Lalezar", system-ui;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="file"] {
            width: 90%;
            padding: 10px;
            border: 1px solid black;
            border-radius: 15px;
            font-size: 14px;
        }

        .options {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .option-item input[type="text"] {
            flex: 1;
            margin-right: 10px;
            border-radius: 10px;
        }

        .option-item img {
            cursor: pointer;
            width: 30px;
            height: 30px;
            margin-left: 10px;
        }

        .option-item img.selected {
            border: 2px solid green;
            border-radius: 50%;
        }

        .submit-button {
            width: 100%;
            padding: 10px;
            background-color: #4B006E;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: "Lalezar", system-ui;
            font-size: 18px;
        }

        .submit-button:hover {
            background-color: #CBC3E3;
        }

        #footer {
            height: 72px;
            width: 100%;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            font-size: small;
            padding-top: 10px;
        }

        #footer ul {
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        #footer ul li {
            display: inline;
            list-style-type: none;
            font-size: 16px;
            padding: 16px;
            text-align: center;
        }

        #footer #instagram, #footer #facebook {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        #footer #facebook {
            margin-left: 4px;
        }

        #footer #copy {
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div id="header">
        <h1>NameThatTune</h1>
        <div id="login">
            <img src="avatar.png" alt="User Avatar">
            <p>Username</p>
        </div>
    </div>

    <!-- Main Content Section -->
    <div id="container">
        <div id="form-container">
            <h2>Edit Quiz</h2>
            <form id="quiz-form">
                <div class="form-group">
                    <label for="song-name">Song Name</label>
                    <input type="text" id="song-name" placeholder="Enter Song Name">
                </div>

                <div class="form-group">
                    <label for="song-photo">Song Photo</label>
                    <input type="file" id="song-photo" accept="image/*">
                    <div id="song-photo-display" style="margin-top: 10px;"></div>
                </div>

                <div class="form-group">
                    <label for="song-mp3">Song MP3</label>
                    <input type="file" id="song-mp3" accept=".mp3">
                    <div id="mp3-display" style="margin-top: 10px;"></div>
                </div>

                <div class="form-group options">
                    <label>Options</label>
                    <div class="option-item">
                        <input type="text" placeholder="Option 1">
                        <img src="Icon/no_select.png" alt="Correct Icon" class="correct-icon">
                    </div>
                    <div class="option-item">
                        <input type="text" placeholder="Option 2">
                        <img src="Icon/no_select.png" alt="Correct Icon" class="correct-icon">
                    </div>
                    <div class="option-item">
                        <input type="text" placeholder="Option 3">
                        <img src="Icon/no_select.png" alt="Correct Icon" class="correct-icon">
                    </div>
                    <div class="option-item">
                        <input type="text" placeholder="Option 4">
                        <img src="Icon/no_select.png" alt="Correct Icon" class="correct-icon">
                    </div>
                </div>

                <button type="submit" class="submit-button">Confirm</button>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <div id="footer">
        <ul>
            <li>About Us</li>
            <li>Terms and Conditions</li>
            <li>Privacy Policy</li>
            <li>Contact Us
                <img src="Icon/facebook.png" alt="Facebook" id="facebook">
                <img src="Icon/instagram.png" alt="Instagram" id="instagram">
            </li>
        </ul>
        <p id="copy">&copy; 2025 NameThatTune. All Rights Reserved.</p>
    </div>

    <script>
        const songPhotoInput = document.getElementById('song-photo');
        const songPhotoDisplay = document.getElementById('song-photo-display');
        const songMp3Input = document.getElementById('song-mp3');
        const mp3Display = document.getElementById('mp3-display');
        const correctIcons = document.querySelectorAll('.correct-icon');
        let audioElement;

        // Handle song photo selection
        songPhotoInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    songPhotoDisplay.innerHTML = `
                        <img src="${e.target.result}" alt="Song Photo" style="max-width: 200px;">
                        <button id="delete-photo">Delete Photo</button>
                    `;
                    // Delete the photo when the button is clicked
                    document.getElementById('delete-photo').addEventListener('click', () => {
                        songPhotoDisplay.innerHTML = '';
                        songPhotoInput.value = ''; // Clear input
                    });
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please select a valid image file.");
            }
        });

        // Handle MP3 file selection
        songMp3Input.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && file.type === "audio/mp3") {
                const fileName = file.name;

                // Display the selected MP3 file
                mp3Display.innerHTML = `
                    <p>Selected MP3: ${fileName}</p>
                    <button id="play-mp3">Play</button>
                    <button id="delete-mp3">Delete</button>
                `;
                
                // Play the MP3 when the button is clicked
                document.getElementById('play-mp3').addEventListener('click', () => {
                    if (!audioElement) {
                        audioElement = new Audio(URL.createObjectURL(file));
                    }
                    audioElement.play();
                });

                // Delete the MP3 when the button is clicked
                document.getElementById('delete-mp3').addEventListener('click', () => {
                    mp3Display.innerHTML = '';
                    songMp3Input.value = ''; // Clear input
                    if (audioElement) {
                        audioElement.pause();  // Stop the audio if playing
                        audioElement = null;   // Reset the audio element
                    }
                });
            } else {
                alert("Please select a valid MP3 file.");
                songMp3Input.value = ''; // Clear input if invalid file
            }
        });

        // Select the correct option
        correctIcons.forEach(icon => {
            icon.addEventListener('click', () => {
                correctIcons.forEach(icon => icon.classList.remove('selected'));  // Deselect all
                icon.classList.add('selected');  // Select the clicked icon
            });
        });
    </script>
</body>
</html>
