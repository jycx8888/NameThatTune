<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management</title>
    <style>
        /* General Styles */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        #header {
            background-color: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            padding: 0 20px;
        }

        #header h1 {
            font-family: "Lalezar", sans-serif;
            font-size: 36px;
            color: white;
        }

        #login {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 5px 10px;
        }

        #login img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        #login p {
            margin-left: 10px;
            color: rgb(104, 99, 174);
            font-weight: bold;
        }

        /* Main Content */
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }

        #form-container {
            position: relative;
            width: 600px;
            padding: 20px 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Close Button */
        #close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* File Input Delete Button */
        .file-preview {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }

        .file-preview button {
            margin-left: 10px;
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Photo Preview */
        #photo-preview img {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 5px;
        }

        /* Options Section */
        .options input[type="text"] {
            width: calc(100% - 40px);
            margin-right: 10px;
        }

        .correct-answer {
            display: inline-block;
            background-color: gray;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            text-align: center;
            cursor: pointer;
        }

        .correct-answer.selected {
            background-color: green;
        }

        /* Confirm Button */
        .submit-button {
            width: 100%;
            padding: 10px;
            background-color: #4B006E;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #673ab7;
        }

        /* Footer */
        #footer {
            height: 72px;
            background-color: black;
            color: white;
            text-align: center;
            line-height: 72px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <h1>NameThatTune</h1>
        <div id="login">
            <img src="avatar.png" alt="User Avatar">
            <p>Username</p>
        </div>
    </div>

    <!-- Main Form -->
    <div id="container">
        <div id="form-container">
            <button id="close-button">×</button>
            <h2>Edit Quiz</h2>
            <form>
                <!-- Song Name -->
                <div class="form-group">
                    <label for="song-name">Song Name</label>
                    <input type="text" id="song-name" placeholder="Enter Song Name">
                </div>

                <!-- Song File -->
                <div class="form-group">
                    <label for="song-file">Song File</label>
                    <input type="file" id="song-file" accept=".mp3">
                    <div class="file-preview" id="song-file-preview" style="display: none;">
                        <span>Uploaded Song.mp3</span>
                        <button type="button" id="delete-song-file">Delete</button>
                    </div>
                </div>

                <!-- Song Photo -->
                <div class="form-group">
                    <label for="song-photo">Song Photo</label>
                    <input type="file" id="song-photo" accept="image/*">
                    <div class="file-preview" id="song-photo-preview" style="display: none;">
                        <span>Uploaded Photo</span>
                        <button type="button" id="delete-song-photo">Delete</button>
                    </div>
                    <div id="photo-preview"></div>
                </div>

                <!-- Options -->
                <div class="form-group options">
                    <label>Options</label>
                    <div>
                        <input type="text" placeholder="Option 1">
                        <button type="button" class="correct-answer">✓</button>
                    </div>
                    <div>
                        <input type="text" placeholder="Option 2">
                        <button type="button" class="correct-answer">✓</button>
                    </div>
                    <div>
                        <input type="text" placeholder="Option 3">
                        <button type="button" class="correct-answer">✓</button>
                    </div>
                    <div>
                        <input type="text" placeholder="Option 4">
                        <button type="button" class="correct-answer">✓</button>
                    </div>
                </div>

                <button type="submit" class="submit-button">Confirm</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer">&copy; 2025 NameThatTune. All Rights Reserved.</div>

    <script>
        // Song File Delete
        const songFileInput = document.getElementById('song-file');
        const songFilePreview = document.getElementById('song-file-preview');
        const deleteSongFileButton = document.getElementById('delete-song-file');

        songFileInput.addEventListener('change', () => {
            songFilePreview.style.display = 'flex';
        });

        deleteSongFileButton.addEventListener('click', () => {
            songFileInput.value = '';
            songFilePreview.style.display = 'none';
        });

        // Song Photo Preview and Delete
        const songPhotoInput = document.getElementById('song-photo');
        const songPhotoPreview = document.getElementById('song-photo-preview');
        const deleteSongPhotoButton = document.getElementById('delete-song-photo');
        const photoPreview = document.getElementById('photo-preview');

        songPhotoInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    photoPreview.innerHTML = `<img src="${e.target.result}" alt="Photo Preview">`;
                };
                reader.readAsDataURL(file);
                songPhotoPreview.style.display = 'flex';
            }
        });

        deleteSongPhotoButton.addEventListener('click', () => {
            songPhotoInput.value = '';
            songPhotoPreview.style.display = 'none';
            photoPreview.innerHTML = '';
        });

        // Correct Answer Selection
        const correctAnswerButtons = document.querySelectorAll('.correct-answer');
        correctAnswerButtons.forEach(button => {
            button.addEventListener('click', () => {
                correctAnswerButtons.forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');
            });
        });
    </script>
</body>
</html>
