<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #header {
            background-color: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            padding: 0 60px;
        }

        #header h1 {
            font-family: "Lalezar", system-ui;
            font-size: 36px;
            font-weight: 1000;
            font-style: normal;
            padding-bottom: 4px;
            margin: 0;
        }

        #login {
            width: 180px;
            height: 48px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 12px;
        }

        #login p {
            font-family: "Lalezar", system-ui;
            font-size: 20px;
            font-weight: 1000;
            font-style: normal;
            margin: 0;
        }

        @media (max-width: 768px) {
            #header {
                flex-direction: column;
                height: auto;
                padding: 10px;
            }

            #header h1 {
                font-size: 28px;
                margin-bottom: 10px;
            }

            #login {
                width: 100%;
                height: auto;
                padding: 10px;
                margin-top: 10px;
            }

            #login img {
                margin-right: 8px;
            }

            #login p {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            #header h1 {
                font-size: 24px;
            }

            #login p {
                font-size: 16px;
            }
        }

        #content {
            height: 785px;
            display: flex;
            justify-content: center;
        }

        #leaderboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            width: 50%;
            height: 80%;
            margin-top: 48px;
            border-radius: 10px;
        }

        #leaderboard h1 {
            font-family: "Lalezar", system-ui;
            font-size: 36px;
            font-weight: 1000;
            font-style: normal;
            padding-bottom: 4px;
            margin-top: 48px;
        }

        .record {
            height: 10%;
            width: 50%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            background-color: grey;
            border-radius: 10px;
        }

        .record h3 {
            font-family: "Lalezar", system-ui;
            font-size: 20px;
            font-weight: 1000;
            font-style: normal;
            padding-bottom: 4px;
            margin-left: px;
        }

        .circle {
            width: 45px;
            height: 45px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 8px;
        }

        .circle h2 {
            font-family: "Lalezar", system-ui;
            font-size: 24px;
            font-weight: 1000;
            font-style: normal;
        }
        
        .second {
            font-family: "Lalezar", system-ui;
            font-size: 20px;
            font-weight: 1000;
            font-style: normal;
            margin-right: 8px;
        }

        </style>
</head>
<body>
    <div id="header">
        <h1>NameThatTune</h1>
        <div id="login" onclick="">
            <img src="account.png" alt="avatar">
            <p>Username</p>
        </div>
    </div>

    <div id="content">
        <div id="leaderboard">
            <h1>Leaderboard</h1>
            <div class="record">
                <div class="circle">
                    <h2>1</h2>
                </div>
                <h3>kumkum</h3>
                <div class="second">1s</div>
            </div>
            <div class="record">
                <div class="circle">
                    <h2>2</h2>
                </div>
                <h3>Diddy</h3>
                <div class="second">2s</div>
            </div>
            <div class="record">
                <div class="circle">
                    <h2>3</h2>
                </div>
                <h3>Mervin Ooi</h3>
                <div class="second">3s</div>
            </div>
            <div class="record">
                <div class="circle">
                    <h2>4</h2>
                </div>
                <h3>player</h3>
                <div class="second">4s</div>
            </div>
            <div class="record">
                <div class="circle">
                    <h2>5</h2>
                </div>
                <h3>Username2</h3>
                <div class="second">5s</div>
            </div>
            <div class="record">
                <div class="circle">
                    <h2>10</h2>
                </div>
                <h3>Hehe(You)</h3>
                <div class="second">10s</div>
            </div>
        </div>
    </div>
    
</body>
</html>
