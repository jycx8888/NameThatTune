<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: fit-content;
            background-color: #f0efe4;
        }

        .header {
            background-color: rgb(179, 174, 174);
            height: 84px;
            width: 100%;            
        }



        .header h1 {
            font-size: 48px;
            font-family: "Lalezar", system-ui;
            font-style: normal;
            font-weight: 1000;
            margin:0 0 0 60px 
        }

        .user {
            margin-right: 20px;
        }

        .content {
            height: 750px;
            text-align: center;
        }

        .name {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            margin-top: 10px;
        }

        .logo {
            margin: 100px auto 0px auto;
            width: 320px;
        }

        .button {
            display: block;
            margin: 15px auto 0px auto;
            width: 200px;
            height: 60px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:active {
            background-color: #3e8e41;
            width: 198px;
            height: 58px;
            margin: 16px auto 186px auto;
        }

        .footer h3 {
            text-align: left;
            color: white;
            line-height: 50px;
            margin-left: 20px;
        }

        .footer p {
            text-align: left;
            color: white;
            margin-left: 20px;
            margin-right: 20px;
        }

        .footer {
            height: 300px;
            width: 100%;
            background-color: black;
        }

    </style>
</head>

<body>
    <div class="header">
        <a href="#" class="logo"><h1>NameThatTune</h1></a>
        <a href="#" class="user"><img src="account.png" alt="user"></a>
    </div>
    
    <div class="content">
        <img src="name_that_tune_logo.jpg" alt="Name That Tune Logo" class="logo">
        <h1 class="name">NameThatTune</h1>
        <button class="button">Start Quiz</button>
    </div>


    <div class="footer">
        <h3>About Us</h3>
    </div>
</body>
</html>
