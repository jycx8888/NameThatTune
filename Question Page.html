<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #header{
            background-color: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        #header h1 {
            font-family: "Lalezar", system-ui;
            font-size: 36px;
            font-weight: 1000;
            font-style: normal;
            padding-bottom: 4px;
            margin-left: 60px;
        }

        #login{
            width: 180px;
            height: 48px;
            background-color:white;
            border-radius: 10px;
            display: flex;
            justify-content: left;
            align-items: center;
            margin-right: 60px;
        }

        #login img {
            width: 30px; /* Adjust the size of the avatar */
            height: 30px;
            border-radius: 50%;
            margin-left: 12px;
        }

        #login p {
            font-family: "Lalezar", system-ui;
            font-size: 20px;
            font-weight: 1000;
            font-style: normal;
            margin-left: 12px;
            padding-bottom: 1px;
        }

        #content {
            height: 785px;
            display: flex;
            justify-content: center;
        }

        #content #album {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 48px 0;
            filter: blur(10px);
        }

        #content #album img {
            width: 280px;
            height: 280px;
            border-radius: 10px;
            ;
        }

        .options{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .opt{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-content: center;
            width: 300px;
            height: 60px;
            background-color: white;
            border-radius: 10px;
            margin: 24px 48px;

        }

        .opt a {
            align-content: center;
            font-size: 24px;
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            font-size: 24px;
            text-decoration: none;
            color: #000;
            margin-bottom: 4px;
        }

        </style>
</head>


<body>
    <div id="header">
        <h1>NameThatTune</h1>
        <div id="login" onclick="">
            <img src="account.png" alt="avatar">
            <p>Username</p>
        </div>
    </div>

    <div id="content">
        <div id="box">
            <div id="album">
                <img src="kaikaikitan.png" alt="album">
            </div>
            <div class="options">
                <div class="opt" id="answer"><a href="#">Kaikai Kitan</a></div>
                <div class="opt"><a href="#">Jujutsu Kaisen</a></div>
            </div>
            <div class="options">
                <div class="opt"><a href="#">Vivid Vice</a></div>
                <div class="opt"><a href="#">Eve</a></div>
            </div>
        </div>

    </div>
</body>
</html>
