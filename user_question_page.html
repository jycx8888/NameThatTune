<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameThatTune</title>
    <link rel="icon" href="icon/favicon.ico" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: rgb(104, 99, 174);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(77, 72, 144);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Lalezar", system-ui;
            font-size: 3rem;
            font-weight: 1000;
            z-index: 1000;
        }

        #header, #main, #footer {
            display: none;
        }

        #header, #footer {
            background-color: rgb(77, 72, 144);
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        #loginOrRegister {
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loginOrRegister img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        h1 {
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            color: white;
        }

        #main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .question-box {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .question-box h2 {
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            color: rgb(77, 72, 144);
        }

        .options {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-button {
            background-color: rgb(77, 72, 144);
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .option-button:hover {
            background-color: rgb(104, 99, 174);
            transform: scale(1.05);
        }

        .option-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #footer {
            clear: both;
            height: 144px;
            width: 100%;
            background-color: black;
            color: white;
            display:inline-block;
            position: relative;
            bottom: 0;
            font-family: "Lalezar", system-ui;
            font-weight: 1000;
            font-size: small;
            justify-content: space-between;
        }

        #footer ul {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 0;
        }

        #footer ul li {
            display: inline;
            list-style-type: none;
            font-size: 16px;
            padding: 16px 16px 4px 16px;
            text-align: center;
        }

        #footer #instagram {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        #footer #facebook {
            width: 26px;
            height: 26px;
            vertical-align: middle;
            margin-left: 4px;
        }

        #footer #copy {
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading">3</div>

    <div id="header">
        <h1>Question Page</h1>
        <div id="loginOrRegister">
            <img src="avatar.png" alt="avatar">
        </div>
    </div>

    <div id="main">
        <div class="question-box">
            <h2 id="question">What is the capital of France?</h2>
            <div class="options">
                <button class="option-button" onclick="selectOption('A')">A. Berlin</button>
                <button class="option-button" onclick="selectOption('B')">B. Madrid</button>
                <button class="option-button" onclick="selectOption('C')">C. Paris</button>
                <button class="option-button" onclick="selectOption('D')">D. Rome</button>
            </div>
        </div>
    </div>

    <div id="footer">
        <ul class="nav">
            <li>About Us</li>
            <li>Terms and Conditions</li>
            <li>Privacy Policy</li>
            <li>Contact Us
                <img src="icon/facebook.png" alt="facebook" id="facebook">&nbsp;
                <img src="icon/instagram.png" alt="instagram" id="instagram">
            </li>
        </ul>
        
        <p id="copy">&copy; 2025 NameThatTune. All Rights Reserved.</p>
    </div>

    <script>
        // Add the sound effect for hovering over the buttons
        const hoverSound = new Audio('hover_sound_effect.mp3');  // Replace with the actual path to your sound file

        // Add event listener to play sound on hover
        document.querySelectorAll('.option-button').forEach(button => {
            button.addEventListener('mouseover', () => {
                hoverSound.play();
            });
        });

        let countdown = 3;

        function updateCountdown() {
            document.getElementById('loading').textContent = countdown;
            if (countdown > 1) {
                countdown--;
                setTimeout(updateCountdown, 1000);
            } else {
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('header').style.display = 'flex';
                    document.getElementById('main').style.display = 'flex';
                    document.getElementById('footer').style.display = 'flex';
                }, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCountdown();
        });

        function selectOption(answer) {
            const correctAnswer = "C"; // Set the correct answer
            const buttons = document.querySelectorAll(".option-button");

            // Disable all buttons after selecting an answer
            buttons.forEach(button => button.disabled = true);

            // Highlight the selected answer and indicate if it is correct or wrong
            buttons.forEach(button => {
                if (button.textContent.startsWith(answer)) {
                    if (answer === correctAnswer) {
                        button.style.backgroundColor = "green";
                    } else {
                        button.style.backgroundColor = "red";
                    }
                }
            });

            // Highlight the correct answer
            buttons.forEach(button => {
                if (button.textContent.startsWith(correctAnswer)) {
                    button.style.backgroundColor = "green";
                }
            });

            // Add a delay and then load the next question
            setTimeout(loadNextQuestion, 2000);
        }

        function loadNextQuestion() {
            // Simulate loading a new question (you can replace this with real question loading logic)
            const questionElement = document.getElementById("question");
            const buttons = document.querySelectorAll(".option-button");

            questionElement.textContent = "What is 2 + 2?";
            buttons[0].textContent = "A. 3";
            buttons[1].textContent = "B. 4";
            buttons[2].textContent = "C. 5";
            buttons[3].textContent = "D. 6";

            // Reset button styles and enable them
            buttons.forEach(button => {
                button.style.backgroundColor = "rgb(77, 72, 144)";
                button.disabled = false;
            });
        }
    </script>
</body>
</html>
