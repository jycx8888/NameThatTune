<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Page</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: rgb(104, 99, 174);
            color: white;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgb(77, 72, 144);
        }
        #header h1 {
            font-size: 1.5rem;
        }
        #header .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .theme-switcher {
            cursor: pointer;
            font-size: 1.5rem;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .question-info {
            margin: 10px 0;
            font-size: 1.2rem;
            background-color: rgb(255, 255, 255, 0.8);
            color: black;
            border-radius: 15px;
            padding: 10px 20px;
        }
        .song-info {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: white;
            color: black;
            padding: 15px;
            border-radius: 10px;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .song-info img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background-color: gray;
        }
        .song-info span {
            font-size: 1rem;
        }
        .scoreboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            gap: 5px;
        }
        .scoreboard .current-score {
            background-color: rgb(255, 255, 255, 0.8);
            color: black;
            padding: 10px;
            border-radius: 10px;
        }
        .navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            gap: 10px;
        }
        .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: white;
            margin: 0 5px;
        }
        .dots span.active {
            background-color: rgb(255, 204, 0);
        }
        .next-button {
            background-color: rgb(255, 204, 0);
            color: black;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgb(77, 72, 144);
        }
        .footer-icon {
            cursor: pointer;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>NameThatTune</h1>
        <div class="right-controls">
            <span class="theme-switcher" onclick="toggleTheme()">☀️</span>
            <div class="avatar"></div>
        </div>
    </div>

    <div id="main">
        <div class="question-info">
            🎵 Question 1
        </div>
        <div class="song-info">
            <img src="#" alt="Song Thumbnail">
            <span>(Name of song, FEAT.)</span>
        </div>
        <div class="scoreboard">
            <div class="current-score">
                1/5 ✔️ - 10 ⭐
            </div>
        </div>
        <div class="navigation">
            <div class="dots">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <button class="next-button" onclick="goToNext()">Next ➜</button>
        </div>
    </div>

    <div id="footer">
        <span class="footer-icon" onclick="toggleMute()">🔊</span>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            body.style.backgroundColor = body.style.backgroundColor === 'rgb(104, 99, 174)' ? '#f4f4f4' : 'rgb(104, 99, 174)';
        }

        function goToNext() {
            alert("Load the next question!");
        }

        function toggleMute() {
            alert("Mute/Unmute Audio!");
        }
    </script>
</body>
</html>
